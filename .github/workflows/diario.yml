name: Generar diario Mercurio

# Cuándo corre: a las 10:00 y 00:00 UTC = 07:00 y 21:00 de Argentina (UTC-3).
# También se puede correr a mano desde la pestaña "Actions" (workflow_dispatch).
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Generar el diario
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node actualizar.mjs

      - name: Preparar el sitio (solo los HTML)
        run: |
          mkdir -p site
          cp *.html site/ 2>/dev/null || true

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
